<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="gwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="gwCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="gwTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="gwGlowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="shadowGw" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#gwBg)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Grid texture -->
  <g opacity="0.07" stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Top accent glow -->
  <line x1="100" y1="2" x2="1100" y2="2" stroke="url(#gwGlowLine)" stroke-width="3" />

  <!-- Title & Branding -->
  <g transform="translate(60, 75)">
    <!-- Icon -->
    <rect width="44" height="44" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <path d="M12 28L22 14L32 28H12Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
    <circle cx="22" cy="18" r="3" fill="#c084fc" />

    <!-- Text -->
    <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#gwTextGrad)" letter-spacing="-0.5">AI Gateway</text>
    <text x="260" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">v1.0.0</text>
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">HTTP API, streaming gateway &amp; web chat for AI coding CLIs with multi-account failover.</text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(60, 175)">
    <!-- Badge 1: HTTP API & Streaming -->
    <rect width="180" height="32" rx="16" fill="#0c4a6e" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5" />
    <text x="90" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">⚡ HTTP &amp; Live SSE Stream</text>

    <!-- Badge 2: Model Failover -->
    <g transform="translate(192, 0)">
      <rect width="180" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.5" />
      <text x="90" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">🔄 Auto Quota Failover</text>
    </g>

    <!-- Badge 3: Web Chat UI -->
    <g transform="translate(384, 0)">
      <rect width="155" height="32" rx="16" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
      <text x="77" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">💬 Modern Web Chat</text>
    </g>

    <!-- Badge 4: agy + claude + copilot -->
    <g transform="translate(551, 0)">
      <rect width="215" height="32" rx="16" fill="#451a03" fill-opacity="0.6" stroke="#d97706" stroke-width="1.5" />
      <text x="107" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">✦ agy • claude • copilot</text>
    </g>
  </g>

  <!-- Interactive Terminal Card -->
  <g transform="translate(60, 230)" filter="url(#shadowGw)">
    <rect width="1080" height="150" rx="12" fill="url(#gwCard)" stroke="#334155" stroke-width="1.5" />
    
    <circle cx="24" cy="20" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5.5" fill="#10b981" />
    <text x="95" y="24" font-family="'Fira Code', monospace" font-size="12" fill="#64748b">AI Gateway Architecture — /v1/prompt &amp; streaming engine</text>

    <!-- Node 1: Inbound Client -->
    <g transform="translate(30, 48)">
      <rect width="260" height="80" rx="8" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#38bdf8">Clients / Webhooks</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">Web Chat / REST API</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="11" fill="#10b981">● Streaming responses</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(305, 78)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#818cf8" stroke-width="2" />
      <polygon points="60,6 70,10 60,14" fill="#818cf8" />
      <text x="35" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#a5b4fc" text-anchor="middle">ROUTER</text>
    </g>

    <!-- Node 2: Gateway Engine -->
    <g transform="translate(390, 48)">
      <rect width="320" height="80" rx="8" fill="#0b0f19" stroke="#818cf8" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#818cf8">AI Gateway Engine</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">Quota monitor &amp; process pool</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="11" fill="#34d399">Auto-switches agy on 429</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(725, 78)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#c084fc" stroke-width="2" />
      <polygon points="60,6 70,10 60,14" fill="#c084fc" />
      <text x="35" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#c084fc" text-anchor="middle">DISPATCH</text>
    </g>

    <!-- Node 3: AI CLI Processes -->
    <g transform="translate(800, 48)">
      <rect width="250" height="80" rx="8" fill="#0b0f19" stroke="#10b981" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#10b981">Underlying CLIs</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">agy • claude • copilot</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">Persistent sessions</text>
    </g>
  </g>
</svg>
